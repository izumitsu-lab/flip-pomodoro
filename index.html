<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minimal Fliqlo Pomodoro</title>
  <style>
    /* 全体のリセットと背景設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
    }

    /* タイマーコンテナ */
    .timer-container {
      display: flex;
      align-items: center;
      gap: 2vw;
    }

    /* フリップカード風のデザイン */
    .flip-card {
      position: relative;
      background-color: #1a1a1a;
      border-radius: 12px;
      padding: 0 4vw;
      height: 60vh;
      min-width: 35vw;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 45vh;
      font-weight: 700;
      letter-spacing: -2px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
      overflow: hidden;
    }

    /* カード中央の切れ目 */
    .flip-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: #000000;
      transform: translateY(-50%);
      box-shadow: 0 1px 2px rgba(255,255,255,0.05);
      z-index: 10;
    }

    /* カードの上半分のシャドウ */
    .flip-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 100%);
      z-index: 5;
    }

    /* コロン（作動中に点滅） */
    .colon {
      font-size: 20vh;
      font-weight: 700;
      padding-bottom: 5vh;
      color: #1a1a1a;
      text-shadow: 0 0 10px rgba(255,255,255,0.1);
      animation: blink 1s infinite; /* 1秒ごとに点滅 */
    }

    /* 一時停止時は点滅を止めて常時点灯 */
    .paused .colon {
      animation: none;
      opacity: 1;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    /* 下部のコントロール（FOCUS / BREAK） */
    .controls {
      position: absolute;
      bottom: 8vh;
      display: flex;
      gap: 3vw;
      font-size: 2.5vh;
      font-weight: 300;
      letter-spacing: 3px;
    }

    .mode-btn {
      color: #333333;
      transition: color 0.4s ease;
      padding: 10px;
      cursor: pointer;
    }

    .mode-btn.active {
      color: #999999;
    }
  </style>
</head>
<body class="paused" id="body" onclick="toggleTimer()">

  <div class="timer-container">
    <div class="flip-card" id="minutes">25</div>
    <div class="colon">:</div>
    <div class="flip-card" id="seconds">00</div>
  </div>
  
  <div class="controls">
    <div id="btn-focus" class="mode-btn active" onclick="setMode('focus', event)">FOCUS</div>
    <div id="btn-break" class="mode-btn" onclick="setMode('break', event)">BREAK</div>
  </div>

  <script>
    const TIME_FOCUS = 25 * 60;
    const TIME_BREAK = 5 * 60;

    let timeLeft = TIME_FOCUS;
    let isRunning = false;
    let currentMode = 'focus';
    let timerInterval;

    const minEl = document.getElementById('minutes');
    const secEl = document.getElementById('seconds');
    const bodyEl = document.getElementById('body');
    const btnFocus = document.getElementById('btn-focus');
    const btnBreak = document.getElementById('btn-break');

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      minEl.textContent = minutes.toString().padStart(2, '0');
      secEl.textContent = seconds.toString().padStart(2, '0');
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        bodyEl.classList.add('paused');
      } else {
        isRunning = true;
        bodyEl.classList.remove('paused');
        
        timerInterval = setInterval(() => {
          timeLeft--;
          updateDisplay();

          if (timeLeft <= 0) {
            const nextMode = currentMode === 'focus' ? 'break' : 'focus';
            setMode(nextMode);
          }
        }, 1000);
      }
    }

    function setMode(mode, event) {
      if (event) event.stopPropagation();

      clearInterval(timerInterval);
      isRunning = false;
      bodyEl.classList.add('paused');
      
      currentMode = mode;
      timeLeft = mode === 'focus' ? TIME_FOCUS : TIME_BREAK;
      
      btnFocus.classList.toggle('active', mode === 'focus');
      btnBreak.classList.toggle('active', mode === 'break');
      
      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
