<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>Flip 2-Min Flow</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flip Flow">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      position: relative;
    }

    /* iPhoneのタッチ抜けを完全に防ぐ専用レイヤー */
    .touch-layer {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: transparent;
      cursor: pointer;
    }

    body.running .touch-layer {
      pointer-events: none; 
    }

    /* 中央から左右に広がるフラッシュエフェクト用レイヤー */
    .flash-overlay {
      position: absolute;
      top: 0;
      left: 50%;
      width: 0%;
      height: 100%;
      background: #ffffff;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
    }

    @keyframes centerFlash {
      0% { left: 50%; width: 0%; opacity: 1; }
      40% { left: 0%; width: 100%; opacity: 0.9; }
      100% { left: 0%; width: 100%; opacity: 0; }
    }

    .flash-trigger {
      animation: centerFlash 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 2分経過後のスタイリッシュな英語メッセージ */
    .flow-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      text-align: center;
      z-index: 110;
      pointer-events: none;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.show-message .flow-message {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .flow-message h1 {
      font-weight: 300;
      font-size: clamp(22px, 4.5vw, 46px);
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255,255,255,0.4);
      margin-bottom: 1.5vh;
      text-transform: uppercase;
    }

    .flow-message p {
      font-weight: 300;
      font-size: clamp(13px, 2vw, 20px);
      letter-spacing: 3px;
      color: #888888;
    }

    /* 呼吸するように優しく明滅する美しいアニメーション */
    @keyframes breathing {
      0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.98); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    .initial-breathing-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 300;
      font-size: clamp(16px, 3.2vw, 30px);
      letter-spacing: 4px;
      color: #666666; 
      text-align: center;
      z-index: 20;
      pointer-events: none;
      transition: color 0.8s ease;
      padding: 0 5vw;
    }

    body.running .initial-breathing-text {
      color: #ffffff;
      animation: breathing 4s ease-in-out infinite;
    }

    body.mode-flow .initial-breathing-text {
      opacity: 0 !important;
      pointer-events: none;
      animation: none;
    }

    /* 後半のフリップ表示中に下部に現れる「集中モード」のメッセージ */
    .focus-mode-label {
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 300;
      font-size: clamp(12px, 2vh, 16px);
      letter-spacing: 4px;
      color: #555555;
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease 0.5s; /* 時計が出てきてから少し遅れてフワッと現れる */
      z-index: 10;
    }

    body.mode-flow .focus-mode-label {
      opacity: 1;
    }

    body.show-message .focus-mode-label {
      opacity: 0; /* メッセージ表示中は一旦隠す */
    }

    /* タイマーコンテナ */
    .timer-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 3vw; 
      transform: translateY(-3vh); 
      opacity: 0;
      transform: translateY(-3vh) scale(0.95);
      pointer-events: none;
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.mode-flow .timer-container {
      opacity: 1;
      transform: translateY(-3vh) scale(1);
      pointer-events: auto;
    }

    body.show-message .timer-container {
      opacity: 0;
      transform: translateY(-3vh) scale(0.95);
      pointer-events: none;
    }

    /* フリップユニット本体 */
    .flip-unit {
      position: relative;
      aspect-ratio: 1 / 1; 
      width: min(42vw, 75vh); 
      height: auto;
      perspective: 1200px;
      border-radius: 3cqmin; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      background-color: #000;
      container-type: inline-size;
      transition: width 0.3s ease;
    }

    @supports not (border-radius: 3cqmin) {
      .flip-unit { border-radius: 12px; }
      .top { border-radius: 12px 12px 0 0; }
      .bottom { border-radius: 0 0 16px 16px; }
    }

    .flip-unit::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: max(4px, 0.8cqmin); 
      background-color: #000000;
      transform: translateY(-50%);
      z-index: 10;
    }

    .top, .bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      background-color: #242424;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .top {
      top: 0;
      border-radius: 3cqmin 3cqmin 0 0;
      transform-origin: bottom;
    }

    .bottom {
      bottom: 0;
      border-radius: 0 0 3cqmin 3cqmin;
      transform-origin: top;
    }

    .top::after, .bottom::after {
      content: attr(data-val);
      position: absolute;
      left: 0;
      width: 100%;
      height: 200%; 
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 78cqi; 
      font-weight: 700;
      letter-spacing: -2px; 
      color: #f5f5f5;
    }

    @supports not (font-size: 78cqi) {
      .top::after, .bottom::after {
        font-size: clamp(80px, 30vw, 400px);
      }
    }

    .top::after { top: 0; }
    .bottom::after { bottom: 0; }

    .top::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 100%);
      z-index: 1;
    }

    /* --- パタパタアニメーション用要素 --- */
    .flip-top {
      z-index: 5;
      animation: flipDownTop 0.25s ease-in forwards;
    }

    .flip-bottom {
      z-index: 5;
      transform: rotateX(90deg);
      animation: flipDownBottom 0.25s ease-out 0.25s forwards;
    }

    @keyframes flipDownTop {
      0% { transform: rotateX(0); filter: brightness(1); }
      100% { transform: rotateX(-90deg); filter: brightness(0.3); }
    }

    @keyframes flipDownBottom {
      0% { transform: rotateX(90deg); filter: brightness(0.3); }
      100% { transform: rotateX(0); filter: brightness(1); }
    }

    /* コロン */
    .colon {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: min(20vw, 35vh); 
      font-weight: 700;
      padding-bottom: 2%; 
      color: #1a1a1a;
      text-shadow: 0 0 10px rgba(255,255,255,0.1);
      animation: blink 1s infinite;
    }

    .running .colon {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    @media (orientation: portrait) {
      .timer-container {
        flex-direction: column; 
        gap: 2vh; 
      }
      .flip-unit {
        width: min(80vw, 32vh); 
      }
      .colon {
        display: none; 
      }
      .focus-mode-label {
        bottom: 7vh;
      }
    }
  </style>
</head>
<body id="body">

  <div id="touch-layer" class="touch-layer"></div>

  <div id="flash-overlay" class="flash-overlay"></div>

  <div class="flow-message">
    <h1>You're in the flow</h1>
    <p>Keep going. The rest is yours.</p>
  </div>

  <div class="initial-breathing-text">
    Just focus for 2 minutes. The rest is yours.
  </div>

  <!-- 後半のフリップ表示中に下部に表示される集中メッセージ -->
  <div class="focus-mode-label">
    KEEP FOCUS
  </div>

  <div class="timer-container">
    <div class="flip-unit" id="min-unit">
      <div class="top" data-val="02"></div>
      <div class="bottom" data-val="02"></div>
    </div>
    <div class="colon">:</div>
    <div class="flip-unit" id="sec-unit">
      <div class="top" data-val="00"></div>
      <div class="bottom" data-val="00"></div>
    </div>
  </div>

  <script>
    const PREP_TIME = 2 * 60; // 2分

    let timeLeft = PREP_TIME;
    let elapsedSeconds = PREP_TIME; 
    let isRunning = false;
    let currentMode = 'prep'; 
    
    let timerInterval;
    let messageTimeoutId;
    let transitionStartTime = 0;

    const bodyEl = document.getElementById('body');
    const flashOverlay = document.getElementById('flash-overlay');
    const touchLayer = document.getElementById('touch-layer');

    function updateDisplayDirect(mStr, sStr) {
      ['min-unit', 'sec-unit'].forEach(id => {
        const val = id === 'min-unit' ? mStr : sStr;
        const unit = document.getElementById(id);
        if (unit) {
          unit.querySelectorAll('.top, .bottom').forEach(el => el.setAttribute('data-val', val));
        }
      });
    }

    function flip(unitId, newNumber) {
      const unit = document.getElementById(unitId);
      if (!unit) return;
      const top = unit.querySelector('.top:not(.flip-top)');
      const bottom = unit.querySelector('.bottom:not(.flip-bottom)');
      if (!top || !bottom) return;
      
      const currentNumber = top.getAttribute('data-val');
      if (currentNumber === newNumber) return;

      unit.querySelectorAll('.flip-top, .flip-bottom').forEach(el => el.remove());

      const flipTop = document.createElement('div');
      flipTop.className = 'top flip-top';
      flipTop.setAttribute('data-val', currentNumber);

      const flipBottom = document.createElement('div');
      flipBottom.className = 'bottom flip-bottom';
      flipBottom.setAttribute('data-val', newNumber);

      unit.appendChild(flipTop);
      unit.appendChild(flipBottom);

      top.setAttribute('data-val', newNumber);

      flipTop.addEventListener('animationend', () => {
        flipTop.remove();
      });

      flipBottom.addEventListener('animationend', () => {
        bottom.setAttribute('data-val', newNumber);
        flipBottom.remove();
      });
    }

    function updateDisplayFlip(mStr, sStr) {
      flip('min-unit', mStr);
      flip('sec-unit', sStr);
    }

    function renderCurrentTime(useFlip = false) {
      if (currentMode === 'prep') {
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        updateDisplayDirect(m, s);
      } else {
        const m = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
        const s = (elapsedSeconds % 60).toString().padStart(2, '0');
        if (useFlip) {
          updateDisplayFlip(m, s);
        } else {
          updateDisplayDirect(m, s);
        }
      }
    }

    function triggerFlowTransition() {
      transitionStartTime = Date.now();

      flashOverlay.classList.remove('flash-trigger');
      void flashOverlay.offsetWidth; 
      flashOverlay.classList.add('flash-trigger');

      bodyEl.classList.add('show-message');

      clearTimeout(messageTimeoutId);
      messageTimeoutId = setTimeout(() => {
        bodyEl.classList.remove('show-message');
        renderCurrentTime(false);
      }, 5000);
    }

    function startTimer(e) {
      if (e) e.stopPropagation();
      if (isRunning) return; 

      isRunning = true;
      bodyEl.classList.add('running'); 
      
      timerInterval = setInterval(() => {
        if (currentMode === 'prep') {
          timeLeft--;
          renderCurrentTime();

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            
            currentMode = 'flow';
            elapsedSeconds = PREP_TIME; 
            bodyEl.classList.add('mode-flow');
            
            triggerFlowTransition();
            
            timerInterval = setInterval(() => {
              elapsedSeconds++;
              const isMessageShowing = (Date.now() - transitionStartTime) < 5000;
              renderCurrentTime(!isMessageShowing);
            }, 1000);
          }
        }
      }, 1000);
    }

    touchLayer.addEventListener('click', startTimer);
    touchLayer.addEventListener('touchend', function(e) {
      e.preventDefault();
      startTimer(e);
    });

    renderCurrentTime();
  </script>
</body>
</html>
